<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ASSET_VERSION = 1 -->
<title>Voisso — 발표용 화면</title>
<script>
/* 첫 페인트 깜빡임 방지 — 통화 화면과 같은 규칙을 따른다. */
(function () {
  try {
    var pref = localStorage.getItem('voisso.theme') || 'auto';
    var dark = pref === 'dark' || (pref === 'auto' &&
      window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
})();
</script>
<style>
/* 발표 중에 깨지면 안 된다. 전환·애니메이션을 넣지 않는다. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --surface-2: #f6f8fb;
  --text: #14202e; --muted: #465362; --line: #dbe2ec;
  --brand: #14456f; --brand-soft: #e6eef6; --accent: #0b6444; --accent-soft: #e2f2ea;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0c1117; --surface: #151d26; --surface-2: #1b242f;
  --text: #e9eff6; --muted: #a6b7c9; --line: #2a3644;
  --brand: #86b9e4; --brand-soft: #17293a; --accent: #4fd0a0; --accent-soft: #12302a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }   /* 페이지 자체는 스크롤하지 않는다 */
body {
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }

/* ── 상단 발표 바 ─────────────────────────────────────── */
.bar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
  padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.logo { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.logo b { font-size: 1rem; font-weight: 800; }
.logo .mark {
  width: 26px; height: 26px; border-radius: 8px; background: var(--brand); color: var(--surface);
  display: grid; place-items: center; font-size: .74rem; font-weight: 800;
}
:root[data-theme="dark"] .logo .mark { color: #0c1117; }

/* 단계 표시 */
.steps { display: flex; align-items: center; gap: 4px; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }
.step {
  flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: 999px; white-space: nowrap;
  border: 1.5px solid var(--line); background: var(--surface-2); color: var(--muted);
  font-size: .8rem; font-weight: 700;
}
.step .n { font-variant-numeric: tabular-nums; opacity: .8; }
.step.done { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.step.now {
  color: var(--surface); background: var(--brand); border-color: var(--brand); font-weight: 800;
}
:root[data-theme="dark"] .step.now { color: #0c1117; }

.tools { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.tool {
  min-height: 34px; padding: 6px 12px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--surface-2);
  font-size: .82rem; font-weight: 800; color: var(--muted);
}
.tool:hover { border-color: var(--brand); color: var(--brand); }
.tool.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }

/* ── 좌우 분할 ────────────────────────────────────────── */
.split { flex: 1 1 auto; display: flex; min-height: 0; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane.left { flex: 0 0 var(--left, 35%); }
.pane.right { flex: 1 1 auto; }
.pane-label {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; font-size: .78rem; font-weight: 800; letter-spacing: .02em;
  color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.pane-label .who {
  padding: 2px 8px; border-radius: 999px; font-size: .72rem;
  background: var(--brand-soft); color: var(--brand);
}
.pane.right .pane-label .who { background: var(--accent-soft); color: var(--accent); }
.pane-label .url { margin-left: auto; opacity: .7; font-weight: 600; }
.frame { flex: 1 1 auto; min-height: 0; border: 0; width: 100%; background: var(--bg); }

/* 드래그 손잡이 */
.grip {
  flex: 0 0 8px; cursor: col-resize; background: var(--line);
  position: relative;
}
.grip::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  width: 2px; height: 32px; margin: -16px 0 0 -1px; border-radius: 2px;
  background: var(--surface);
}
.grip:hover { background: var(--brand); }

/* 발표 화면이다. 좁아져도 좌우를 유지한다.
   (예전에는 900px 에서 자동으로 세로가 됐는데, 노트북 창에서 너무 쉽게 걸려
    오른쪽 대시보드가 화면 밖으로 밀려났다.) */
:root[data-layout="col"] .split { flex-direction: column; }
:root[data-layout="col"] .pane.left { flex: 0 0 var(--left, 50%); }
:root[data-layout="col"] .grip { cursor: row-resize; }
:root[data-layout="col"] .grip::after { width: 32px; height: 2px; margin: -1px 0 0 -16px; }

/* 자동은 아주 좁을 때만. 사용자가 직접 고르면(data-layout=row) 그게 이긴다. */
@media (max-width: 640px) {
  :root[data-layout="auto"] .split { flex-direction: column; }
  :root[data-layout="auto"] .pane.left { flex: 0 0 var(--left, 50%); }
  :root[data-layout="auto"] .grip { cursor: row-resize; }
}
</style>
</head>
<body>

<header class="bar">
  <span class="logo"><span class="mark">보</span><b>Voisso 발표 화면</b></span>

  <nav class="steps" id="steps" aria-label="시연 단계">
    <button class="step" data-step="1" type="button"><span class="n">①</span> 접수</button>
    <button class="step" data-step="2" type="button"><span class="n">②</span> 배정</button>
    <button class="step" data-step="3" type="button"><span class="n">③</span> 민원카드</button>
    <button class="step" data-step="4" type="button"><span class="n">④</span> 대시보드</button>
    <button class="step" data-step="5" type="button"><span class="n">⑤</span> 담당자 연결</button>
    <button class="step" data-step="6" type="button"><span class="n">⑥</span> 진행 안내</button>
  </nav>

  <div class="tools">
    <button class="tool" id="btnLayout" type="button" title="좌우 / 상하 배치">좌우</button>
    <button class="tool" id="btnRatio" type="button" title="좌우 비율 바꾸기">35 : 65</button>
    <button class="tool" id="btnOfficer" type="button" title="담당자를 연결한다 (시연용)">담당자 연결</button>
    <button class="tool" id="btnDebug" type="button" title="왼쪽 화면에 진단 정보를 켠다">시연 모드</button>
    <button class="tool" id="btnReset" type="button" title="새 통화로 초기화">초기화</button>
  </div>
</header>

<main class="split" id="split">
  <section class="pane left">
    <div class="pane-label"><span class="who">민원인 화면</span> 어르신이 보는 화면
      <span class="url" id="leftUrl"></span></div>
    <iframe class="frame" id="callFrame" title="민원인 화면" src="../call/"></iframe>
  </section>

  <div class="grip" id="grip" role="separator" aria-orientation="vertical"
       aria-label="좌우 너비 조절" tabindex="0"></div>

  <section class="pane right">
    <div class="pane-label"><span class="who">담당자 화면</span> 경상북도청 담당자가 보는 화면
      <span class="url" id="rightUrl"></span></div>
    <iframe class="frame" id="dashFrame" title="담당자 화면" src="../dashboard/"></iframe>
  </section>
</main>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var callFrame = $('callFrame'), dashFrame = $('dashFrame');
  var RATIOS = [35, 42, 50];
  var ratioIdx = 0;

  /* ── 배치 (좌우 / 상하) ──
     기본은 좌우다. 발표 중에 창 크기 때문에 한쪽이 사라지면 안 된다. */
  var layout = 'row';
  try { layout = localStorage.getItem('voisso.demo.layout') || 'row'; } catch (e) {}
  function setLayout(v) {
    layout = v;
    document.documentElement.dataset.layout = v;
    $('btnLayout').textContent = v === 'col' ? '상하' : '좌우';
    try { localStorage.setItem('voisso.demo.layout', v); } catch (e) {}
  }
  setLayout(layout === 'col' ? 'col' : 'row');
  $('btnLayout').addEventListener('click', function () { setLayout(layout === 'row' ? 'col' : 'row'); });

  /* ── 좌우 비율 ── */
  function setRatio(pct) {
    pct = Math.min(75, Math.max(25, pct));
    document.documentElement.style.setProperty('--left', pct + '%');
    $('btnRatio').textContent = Math.round(pct) + ' : ' + Math.round(100 - pct);
    try { localStorage.setItem('voisso.demo.ratio', String(pct)); } catch (e) {}
  }
  var saved = null;
  try { saved = parseFloat(localStorage.getItem('voisso.demo.ratio')); } catch (e) {}
  setRatio(saved && isFinite(saved) ? saved : RATIOS[0]);

  $('btnRatio').addEventListener('click', function () {
    ratioIdx = (ratioIdx + 1) % RATIOS.length;
    setRatio(RATIOS[ratioIdx]);
  });

  /* 드래그로 조절. iframe 위에서도 놓치지 않도록 포인터를 잡는다. */
  var grip = $('grip'), dragging = false;
  grip.addEventListener('pointerdown', function (e) {
    dragging = true; grip.setPointerCapture(e.pointerId);
    callFrame.style.pointerEvents = 'none'; dashFrame.style.pointerEvents = 'none';
  });
  grip.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var r = $('split').getBoundingClientRect();
    setRatio(((e.clientX - r.left) / r.width) * 100);
  });
  function endDrag() {
    dragging = false;
    callFrame.style.pointerEvents = ''; dashFrame.style.pointerEvents = '';
  }
  grip.addEventListener('pointerup', endDrag);
  grip.addEventListener('pointercancel', endDrag);
  grip.addEventListener('keydown', function (e) {
    var cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--left')) || 42;
    if (e.key === 'ArrowLeft') { setRatio(cur - 2); e.preventDefault(); }
    if (e.key === 'ArrowRight') { setRatio(cur + 2); e.preventDefault(); }
  });

  /* ── 시연 모드 토글 (왼쪽 화면에만 ?debug=1) ── */
  var debugOn = false;
  function applyDebug() {
    $('btnDebug').classList.toggle('on', debugOn);
    $('btnDebug').textContent = debugOn ? '시연 모드 끄기' : '시연 모드';
    // 같은 오리진이면 다시 불러오지 않고 속성만 바꾼다.
    // 발표 중에 통화가 진행되고 있을 수 있다 — 리로드하면 그게 날아간다.
    var win = null;
    try { win = callFrame.contentWindow; } catch (e) {}
    if (win && typeof win.VoissoSetMode === 'function') {
      win.VoissoSetMode(debugOn ? 'demo' : 'elder');   // 통화가 진행 중이어도 유지된다
      return;
    }
    var d = null;
    try { d = callFrame.contentDocument; } catch (e) {}
    if (d && d.documentElement) {                       // 구버전 통화 화면 폴백
      d.documentElement.dataset.mode = debugOn ? 'demo' : 'elder';
      return;
    }
    callFrame.src = '../call/' + (debugOn ? '?debug=1' : '?debug=0');   // 다른 오리진이면 폴백
  }
  $('btnDebug').addEventListener('click', function () { debugOn = !debugOn; applyDebug(); });

  /* ── 담당자 연결 (시연용) ──
     혼자 시연할 때 대시보드를 따로 조작하지 않아도 6단계가 흐르게 한다.
     통화 화면 안의 같은 트리거를 대신 눌러 준다. */
  $('btnOfficer').addEventListener('click', async function () {
    var win = null;
    try { win = callFrame.contentWindow; } catch (e) {}
    var sim = win && win.VoissoSimOfficer;
    if (!sim) { alertLike('통화 화면에 접근할 수 없습니더.'); return; }
    var btn = $('btnOfficer'), keep = btn.textContent;
    btn.disabled = true;
    // 아직 연결 전이면 연결하고, 연결돼 있으면 담당자 메시지를 보낸다.
    var r = sim.isOpen() ? await sim.message() : await sim.connect();
    btn.disabled = false;
    if (!r.ok) { alertLike(r.why || '실패했습니더'); return; }
    btn.textContent = sim.isOpen() ? '담당자 메시지' : '담당자 연결';
    if (btn.textContent === keep) { alertLike('보냈습니더'); }
  });

  // 발표 중에 모달이 뜨면 흐름이 끊긴다. 상단 바 버튼에 잠깐 표시만 한다.
  function alertLike(msg) {
    var b = $('btnOfficer'), keep = b.textContent;
    b.textContent = msg;
    setTimeout(function () { b.textContent = keep; }, 2600);
  }

  /* ── 초기화 — 새 통화 ── */
  $('btnReset').addEventListener('click', function () {
    callFrame.src = '../call/' + (debugOn ? '?debug=1' : '?debug=0');
    dashFrame.src = '../dashboard/';
    setStep(1, true);
  });

  /* ── 단계 표시 ──────────────────────────────────────────
     기본은 자동 감지다(같은 오리진이면 왼쪽 화면 상태를 읽는다).
     읽을 수 없으면 발표자가 직접 눌러 옮길 수 있다. 어느 쪽이든 동작한다. */
  var manual = 0;
  function setStep(n, isManual) {
    if (isManual) manual = n;
    var els = document.querySelectorAll('.step');
    for (var i = 0; i < els.length; i++) {
      var v = Number(els[i].dataset.step);
      els[i].classList.toggle('now', v === n);
      els[i].classList.toggle('done', v < n);
    }
  }
  document.querySelectorAll('.step').forEach(function (b) {
    b.addEventListener('click', function () { setStep(Number(b.dataset.step), true); });
  });

  function detectStep() {
    var d = null;
    try { d = callFrame.contentDocument; } catch (e) { return null; }
    if (!d || !d.getElementById) return null;
    var active = d.querySelector('.screen.is-active');
    var id = active ? active.id : '';
    if (id === 'screenIncoming') return 6;
    var callee = d.querySelector('.callee');
    if (callee && callee.classList.contains('is-handoff')) return 5;
    var wait = d.getElementById('handoffWait');
    if (wait && !wait.hidden) return 4;
    if (id === 'screenResult') return 3;
    if (id === 'screenCall') {
      var slots = d.querySelectorAll('#slots .slot.filled').length;
      return slots >= 1 ? 2 : 1;
    }
    return 1;
  }

  setStep(1);
  setInterval(function () {
    var n = detectStep();
    if (n && n !== manual) { manual = 0; setStep(n); }
  }, 1500);

  /* 주소 표시 — 어디를 보고 있는지 숨기지 않는다 */
  function paintUrls() {
    var base = location.origin === 'null' ? '' : location.origin;
    $('leftUrl').textContent = base + '/call/';
    $('rightUrl').textContent = base + '/dashboard/';
  }
  paintUrls();
  applyDebug();
})();
</script>
</body>
</html>
